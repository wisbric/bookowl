services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bookowl
      POSTGRES_PASSWORD: bookowl
      POSTGRES_DB: bookowl
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookowl"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  collab:
    build:
      context: ./collab
      dockerfile: Dockerfile
    ports:
      - "1234:1234"
    environment:
      DATABASE_URL: postgres://bookowl:bookowl@postgres:5432/bookowl
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BOOKOWL_SECRET_KEY: ""
      PORT: 1234
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
