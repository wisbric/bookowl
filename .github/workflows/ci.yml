name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookowl
          POSTGRES_PASSWORD: bookowl
          POSTGRES_DB: bookowl
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wisbric/core
          path: ../core
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
      - name: Verify sqlc diff
        run: sqlc diff
      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4
      - name: Test
        run: make test
        env:
          BOOKOWL_DB_URL: postgres://bookowl:bookowl@localhost:5432/bookowl?sslmode=disable
          BOOKOWL_REDIS_URL: redis://localhost:6379/1
      - name: Build
        run: make build

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd web && npm install
      - run: cd web && npm run lint
      - run: cd web && npm run build

  collab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: cd collab && npm ci
      - run: cd collab && npm run build
