version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/global/query/"
    schema: "migrations/global/"
    gen:
      go:
        package: "dbglobal"
        out: "internal/db/global"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
  - engine: "postgresql"
    queries: "internal/db/tenant/query/"
    schema: "migrations/tenant/"
    gen:
      go:
        package: "dbtenant"
        out: "internal/db/tenant"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
