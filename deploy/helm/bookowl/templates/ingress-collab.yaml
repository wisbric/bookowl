{{- if and .Values.collab.enabled .Values.collab.ingress.enabled }}
{{- $collabPath := .Values.collab.ingress.path | default "/" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bookowl.fullname" . }}-collab
  labels:
    {{- include "bookowl.labels" . | nindent 4 }}
    app.kubernetes.io/component: collab
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$request_uri"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    {{- if ne $collabPath "/" }}
    nginx.ingress.kubernetes.io/rewrite-target: /
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  tls:
    - secretName: {{ .Values.collab.ingress.tlsSecretName | default (printf "%s-collab-tls" (include "bookowl.fullname" .)) }}
      hosts:
        - {{ .Values.collab.ingress.host | quote }}
  rules:
    - host: {{ .Values.collab.ingress.host | quote }}
      http:
        paths:
          - path: {{ $collabPath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "bookowl.fullname" . }}-collab
                port:
                  number: {{ .Values.collab.port }}
{{- end }}
