{{- if or .Values.database.url .Values.redis.url .Values.nightowl.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bookowl.fullname" . }}
  labels:
    {{- include "bookowl.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.url }}
  BOOKOWL_DB_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if .Values.redis.url }}
  BOOKOWL_REDIS_URL: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- if .Values.nightowl.apiKey }}
  BOOKOWL_NIGHTOWL_API_KEY: {{ .Values.nightowl.apiKey | quote }}
  {{- end }}
{{- end }}
