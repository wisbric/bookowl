apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bookowl.fullname" . }}
  labels:
    {{- include "bookowl.labels" . | nindent 4 }}
data:
  APP_MODE: api
  APP_PORT: {{ .Values.api.port | quote }}
  {{- $oidcIssuer := .Values.oidc.issuerUrl | default (dig "oidc" "issuerUrl" "" (.Values.global | default dict)) }}
  {{- if $oidcIssuer }}
  OIDC_ISSUER: {{ $oidcIssuer | quote }}
  {{- end }}
  {{- if .Values.oidc.clientId }}
  OIDC_CLIENT_ID: {{ .Values.oidc.clientId | quote }}
  {{- end }}
  {{- if .Values.publicUrl }}
  BOOKOWL_PUBLIC_URL: {{ .Values.publicUrl | quote }}
  {{- end }}
  {{- if .Values.nightowl.apiUrl }}
  BOOKOWL_NIGHTOWL_API_URL: {{ .Values.nightowl.apiUrl | quote }}
  {{- end }}
  {{- if .Values.collab.wsUrl }}
  BOOKOWL_COLLAB_WS_URL: {{ .Values.collab.wsUrl | quote }}
  {{- end }}
  {{- if .Values.nightowl.url }}
  BOOKOWL_NIGHTOWL_URL: {{ .Values.nightowl.url | quote }}
  {{- end }}
  {{- if .Values.ticketowl.url }}
  BOOKOWL_TICKETOWL_URL: {{ .Values.ticketowl.url | quote }}
  {{- end }}
