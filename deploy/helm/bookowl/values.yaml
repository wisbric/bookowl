image:
  repository: ghcr.io/wisbric/bookowl
  tag: ""   # defaults to Chart.appVersion
  pullPolicy: IfNotPresent

web:
  image:
    repository: ghcr.io/wisbric/bookowl-web
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

api:
  replicas: 2
  port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

secretKey: ""   # 32-byte hex, used to sign session JWTs (set via external secret)

database:
  url: ""   # set via external secret

redis:
  url: ""   # set via external secret
  host: ""
  port: "6379"
  password: ""

oidc:
  issuerUrl: ""
  clientId: bookowl

nightowl:
  apiUrl: ""
  apiKey: ""   # set via external secret

collab:
  enabled: true
  image:
    repository: ghcr.io/wisbric/bookowl-collab
    tag: ""
  replicas: 2
  port: 1234
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  wsUrl: wss://collab.bookowl.example.com
  ingress:
    enabled: true
    host: collab.bookowl.example.com

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
  hosts:
    - host: bookowl.example.com
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /api
          pathType: Prefix
          service: api
  tls:
    - secretName: bookowl-tls
      hosts:
        - bookowl.example.com

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

pdb:
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ""

imagePullSecrets: []
extraEnv: []
